<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amco Map · Follow-ups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #fafaf7;
      --surface:   #ffffff;
      --surface2:  #f4f4ee;
      --border:    #e6e4d9;
      --borderH:   #d8d5c5;
      --text:      #1f2117;
      --text2:     #535649;
      --text3:     #8e9080;
      --accent:    #5d8a64;
      --accentDim: #dde9da;
      --accentDk:  #2f5a3d;
      --warn:      #c08438;
      --warnSoft:  #f3e3cb;
      --alert:     #b85544;
      --alertSoft: #f0d3ce;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.45; }
    button { font-family: inherit; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    *::-webkit-scrollbar { width: 6px; } *::-webkit-scrollbar-thumb { background: rgba(0,0,0,.12); border-radius: 3px; } *::-webkit-scrollbar-track { background: transparent; }

    /* ── Top nav ─────────────────────────────────────────── */
    #top-nav {
      background: var(--surface); border-bottom: 1px solid var(--border);
      height: 52px; display: flex; align-items: center; padding: 0 24px; gap: 8px;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; }
    .nav-brand:hover { text-decoration: none; }
    .nav-brand .brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
    .nav-brand .brand-mark::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
    .nav-brand-name { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); }
    .nav-sep { width: 1px; height: 20px; background: var(--border); margin: 0 8px; flex-shrink: 0; }
    .nav-links { display: flex; align-items: center; gap: 2px; }
    .nav-icon-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 9px; color: var(--text3); border: 1px solid transparent; text-decoration: none; transition: background .12s, color .12s; flex-shrink: 0; }
    .nav-icon-btn:hover { background: var(--surface2); color: var(--text2); text-decoration: none; }
    .nav-icon-btn.active { background: var(--accentDim); color: var(--accentDk); border-color: rgba(93,138,100,.3); }
    .nav-followups-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 9px; color: var(--text2); font-size: 12.5px; border: 1px solid var(--border); text-decoration: none; transition: background .12s, color .12s; flex-shrink: 0; margin-left: 2px; }
    .nav-followups-btn:hover { background: var(--surface2); color: var(--text); text-decoration: none; }
    .nav-followups-btn.active { background: var(--accentDim); color: var(--accentDk); border-color: rgba(93,138,100,.3); }
    .nav-badge { background: var(--warn); color: #fff; font-size: 10.5px; font-weight: 600; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; display: inline-flex; align-items: center; justify-content: center; }
    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .nav-user-name { font-size: 12.5px; color: var(--text2); }
    .nav-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accentDk); color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .nav-btn { background: transparent; color: var(--text2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 13px; font-size: 12.5px; cursor: pointer; transition: background .12s, color .12s; }
    .nav-btn:hover { background: var(--surface2); color: var(--text); }

    /* ── Main ───────────────────────────────────────────── */
    main { max-width: 860px; margin: 0 auto; padding: 28px 24px 60px; }
    .page-eyebrow { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; }
    .page-title { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin-top: 5px; }
    .page-sub { font-size: 13px; color: var(--text2); margin-top: 5px; margin-bottom: 24px; }

    /* ── Group sections ─────────────────────────────────── */
    .group { margin-bottom: 28px; }
    .group-label {
      display: flex; align-items: center; gap: 10px;
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em;
      color: var(--text3); margin-bottom: 10px;
    }
    .group-label .group-count { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 100px; }
    .group-label.overdue-label { color: var(--alert); }
    .group-label.overdue-label .group-count { background: var(--alertSoft); color: var(--alert); }
    .group-label.today-label { color: var(--warn); }
    .group-label.today-label .group-count { background: var(--warnSoft); color: var(--warn); }
    .group-label.upcoming-label .group-count { background: var(--accentDim); color: var(--accentDk); }

    /* ── Date subgroup ──────────────────────────────────── */
    .date-subgroup { margin-bottom: 14px; }
    .date-subgroup-label { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 7px; padding-left: 2px; }

    /* ── Follow-up card ─────────────────────────────────── */
    .fu-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 16px; margin-bottom: 8px;
      display: flex; gap: 14px; align-items: flex-start;
      transition: box-shadow .12s;
    }
    .fu-card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.07); }
    .fu-card.overdue { border-color: rgba(184,85,68,.35); background: #fffaf9; }
    .fu-card-left { flex: 1; min-width: 0; }
    .fu-installer { font-weight: 600; font-size: 13.5px; color: var(--text); }
    .fu-meta { font-size: 12px; color: var(--text3); margin-top: 3px; }
    .fu-notes { font-size: 12.5px; color: var(--text2); margin-top: 6px; line-height: 1.5; }
    .fu-next { font-size: 12px; color: var(--accentDk); margin-top: 5px; }
    .fu-card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .fu-employee { font-size: 12px; color: var(--text3); text-align: right; }
    .fu-days-badge {
      font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 100px; white-space: nowrap;
    }
    .fu-days-badge.overdue { background: var(--alertSoft); color: var(--alert); }
    .fu-days-badge.today  { background: var(--warnSoft);  color: var(--warn); }
    .fu-days-badge.soon   { background: var(--accentDim); color: var(--accentDk); }
    .fu-open-btn {
      font-size: 12px; padding: 5px 11px; border-radius: 7px;
      background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
      cursor: pointer; transition: background .12s, color .12s; white-space: nowrap;
      text-decoration: none; display: inline-block;
    }
    .fu-open-btn:hover { background: var(--accentDim); color: var(--accentDk); border-color: var(--accent); text-decoration: none; }

    /* ── Empty / loading states ─────────────────────────── */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
    .empty-state .big { font-size: 40px; margin-bottom: 10px; }
    .empty-state p { font-size: 14px; }
    #loading-msg { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 14px; }

    /* ── Login ──────────────────────────────────────────── */
    #login-screen { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 10000; align-items: center; justify-content: center; padding: 24px; }
    #login-screen.visible { display: flex; }
    #login-screen::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(0,30,15,.06) 1px, transparent 1px); background-size: 32px 32px; opacity: 0.5; pointer-events: none; }
    #login-card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 48px 44px; width: 460px; max-width: 100%; box-shadow: 0 24px 64px rgba(0,0,0,.08); }
    #login-card .brand-mark { width: 36px; height: 36px; border-radius: 10px; margin-bottom: 28px; display: flex; align-items: center; justify-content: center; background: var(--accent); }
    #login-card .brand-mark::after { content: ''; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
    #login-card .eyebrow { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; }
    #login-card h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; color: var(--text); margin-top: 6px; }
    #login-card p.intro { font-size: 14px; color: var(--text2); margin-top: 8px; line-height: 1.55; }
    #ms-btn { margin-top: 32px; width: 100%; padding: 14px 0; background: var(--text); color: #fff; border: 0; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 12px; transition: filter .12s; }
    #ms-btn:hover { filter: brightness(1.1); }
    #login-error { margin-top: 14px; font-size: 12.5px; color: var(--alert); padding: 10px 12px; background: var(--alertSoft); border-radius: 8px; display: none; }

    @media (max-width: 640px) {
      main { padding: 18px 14px 40px; }
      .nav-brand-name, .nav-user-name { display: none; }
      .fu-card { flex-direction: column; gap: 10px; }
      .fu-card-right { flex-direction: row; align-items: center; }
    }
  </style>
</head>
<body>

<nav id="top-nav">
  <a href="index.html" class="nav-brand">
    <div class="brand-mark"></div>
    <span class="nav-brand-name">Amco Map</span>
  </a>
  <div class="nav-sep"></div>
  <div class="nav-links">
    <a href="index.html" class="nav-icon-btn" title="Map">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
    </a>
    <a href="dashboard.html" class="nav-icon-btn" title="Dashboard">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <rect x="2" y="13" width="5" height="9" rx="1.5"/>
        <rect x="9.5" y="8" width="5" height="14" rx="1.5"/>
        <rect x="17" y="3" width="5" height="19" rx="1.5"/>
      </svg>
    </a>
    <a href="followups.html" class="nav-followups-btn active" title="Follow-ups">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="8" cy="8" r="6.5"/>
        <polyline points="8,4.5 8,8 10.5,9.5"/>
      </svg>
      <span>Follow-ups</span>
      <span class="nav-badge" id="nav-followups-count" style="display:none">0</span>
    </a>
  </div>
  <div class="nav-right">
    <span class="nav-user-name" id="user-name-display"></span>
    <div class="nav-avatar" id="user-avatar"></div>
    <button class="nav-btn" id="sign-out-btn">Sign out</button>
  </div>
</nav>

<div id="login-screen">
  <div id="login-card">
    <div class="brand-mark"></div>
    <div class="eyebrow">Sign in</div>
    <h1>Welcome back.</h1>
    <p class="intro">Sign in with your Microsoft work account to view follow-ups.</p>
    <button id="ms-btn">
      <svg width="18" height="18" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
        <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
      </svg>
      Continue with Microsoft
    </button>
    <div id="login-error">Sign-in failed. Please try again.</div>
  </div>
</div>

<main>
  <div class="page-eyebrow">Outreach</div>
  <div class="page-title">Open Follow-ups</div>
  <div class="page-sub">Installers currently marked as "Follow Up" — grouped by due date.</div>
  <div id="content"><div id="loading-msg">Loading…</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared/escape-html.js"></script>
<script>
const { createClient } = supabase;
const db = createClient(
  'https://teezsldwkpwzgvfizial.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlZXpzbGR3a3B3emd2Zml6aWFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NzUxMjAsImV4cCI6MjA5NDU1MTEyMH0.8rRoiHuS98HZp4jHSYbL31J3O9fn36tKEy9ooosPoGU'
);

let currentUser = null;

function getUserName(user) {
  return user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0] || 'User';
}
function getInitials(name) {
  const parts = name.trim().split(/\s+/);
  return parts.length >= 2 ? (parts[0][0] + parts[1][0]).toUpperCase() : name.slice(0,2).toUpperCase();
}

document.getElementById('ms-btn').addEventListener('click', async () => {
  document.getElementById('login-error').style.display = 'none';
  const { error } = await db.auth.signInWithOAuth({
    provider: 'azure',
    options: { scopes: 'email profile openid', redirectTo: window.location.href.split('#')[0] }
  });
  if (error) document.getElementById('login-error').style.display = 'block';
});

document.getElementById('sign-out-btn').addEventListener('click', async () => {
  await db.auth.signOut();
  document.getElementById('login-screen').classList.add('visible');
});

function onAuthenticated(user) {
  if (!user.email?.toLowerCase().endsWith('@amcorenewables.co.uk')) {
    db.auth.signOut();
    const err = document.getElementById('login-error');
    err.textContent = 'Access restricted to @amcorenewables.co.uk accounts.';
    err.style.display = 'block';
    document.getElementById('login-screen').classList.add('visible');
    return;
  }
  currentUser = user;
  document.getElementById('login-screen').classList.remove('visible');
  const name = getUserName(user);
  const dispEl   = document.getElementById('user-name-display');
  const avatarEl = document.getElementById('user-avatar');
  if (dispEl)   dispEl.textContent   = name;
  if (avatarEl) avatarEl.textContent = getInitials(name);
}

async function loadFollowups() {
  const { data, error } = await db
    .from('contacts')
    .select('*')
    .eq('outcome', 'Follow Up')
    .is('deleted_at', null)
    .order('contacted_at', { ascending: false });

  if (error) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>Failed to load. Please refresh.</p></div>';
    return;
  }

  // Keep only latest contact per installer
  const latestMap = {};
  data.forEach(r => {
    if (!latestMap[r.installer_id]) latestMap[r.installer_id] = r;
  });
  const followups = Object.values(latestMap).filter(r => r.outcome === 'Follow Up');

  // Update nav badge
  const badge = document.getElementById('nav-followups-count');
  if (badge) { badge.textContent = followups.length; badge.style.display = followups.length > 0 ? 'inline-flex' : 'none'; }

  if (!followups.length) {
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="big">✅</div>
        <p>No open follow-ups right now. Great work!</p>
      </div>`;
    return;
  }

  const today = new Date().toISOString().slice(0, 10);

  // Bucket into overdue / today / upcoming (by date)
  const overdue  = followups.filter(r => r.follow_up_date && r.follow_up_date < today);
  const dueToday = followups.filter(r => r.follow_up_date === today);
  const upcoming = followups.filter(r => !r.follow_up_date || r.follow_up_date > today);

  // Sort each bucket
  overdue.sort((a,b)  => (a.follow_up_date||'9999') < (b.follow_up_date||'9999') ? -1 : 1);
  dueToday.sort((a,b) => (a.installer_name||'').localeCompare(b.installer_name||''));
  upcoming.sort((a,b) => (a.follow_up_date||'9999') < (b.follow_up_date||'9999') ? -1 : 1);

  let html = '';

  if (overdue.length) {
    html += `<div class="group">
      <div class="group-label overdue-label">
        ⚠ Overdue
        <span class="group-count">${overdue.length}</span>
      </div>
      ${renderGroup(overdue, today, 'overdue')}
    </div>`;
  }

  if (dueToday.length) {
    html += `<div class="group">
      <div class="group-label today-label">
        🕐 Due today
        <span class="group-count">${dueToday.length}</span>
      </div>
      ${renderGroup(dueToday, today, 'today')}
    </div>`;
  }

  if (upcoming.length) {
    // Sub-group upcoming by date
    const byDate = {};
    upcoming.forEach(r => {
      const key = r.follow_up_date || 'no-date';
      if (!byDate[key]) byDate[key] = [];
      byDate[key].push(r);
    });
    const dateKeys = Object.keys(byDate).sort();
    let upcomingHtml = dateKeys.map(key => {
      const items = byDate[key];
      const label = key === 'no-date'
        ? 'No date set'
        : new Date(key + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
      return `<div class="date-subgroup">
        <div class="date-subgroup-label">${label}</div>
        ${items.map(r => renderCard(r, today, 'soon')).join('')}
      </div>`;
    }).join('');
    html += `<div class="group">
      <div class="group-label upcoming-label">
        Upcoming
        <span class="group-count">${upcoming.length}</span>
      </div>
      ${upcomingHtml}
    </div>`;
  }

  document.getElementById('content').innerHTML = html;
}

function renderGroup(items, today, type) {
  return items.map(r => renderCard(r, today, type)).join('');
}

function renderCard(r, today, type) {
  const overdueClass = type === 'overdue' ? 'overdue' : '';

  let daysBadge = '';
  if (type === 'overdue' && r.follow_up_date) {
    const diff = Math.floor((new Date(today) - new Date(r.follow_up_date)) / 86400000);
    daysBadge = `<span class="fu-days-badge overdue">${diff} day${diff !== 1 ? 's' : ''} overdue</span>`;
  } else if (type === 'today') {
    daysBadge = `<span class="fu-days-badge today">Due today</span>`;
  } else if (r.follow_up_date) {
    const diff = Math.ceil((new Date(r.follow_up_date) - new Date(today)) / 86400000);
    daysBadge = `<span class="fu-days-badge soon">in ${diff} day${diff !== 1 ? 's' : ''}</span>`;
  }

  const contactedDate = r.contacted_at
    ? new Date(r.contacted_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
    : '';

  const notes = r.notes
    ? `<div class="fu-notes">${escapeHtml(r.notes)}</div>`
    : '';

  const next = r.next_action
    ? `<div class="fu-next">→ ${escapeHtml(r.next_action)}</div>`
    : '';

  const mapLink = `index.html`;

  return `<div class="fu-card ${overdueClass}">
    <div class="fu-card-left">
      <div class="fu-installer">${escapeHtml(r.installer_name || '—')}</div>
      <div class="fu-meta">Logged ${contactedDate}${r.employee ? ' · ' + escapeHtml(r.employee) : ''}</div>
      ${notes}${next}
    </div>
    <div class="fu-card-right">
      ${daysBadge}
      <div class="fu-employee">${escapeHtml(r.employee || '')}</div>
      <a href="${mapLink}" class="fu-open-btn" title="Open on map">View on map →</a>
    </div>
  </div>`;
}

db.auth.getSession().then(({ data: { session } }) => {
  if (session?.user) { onAuthenticated(session.user); loadFollowups(); }
  else document.getElementById('login-screen').classList.add('visible');
});
db.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session?.user) { onAuthenticated(session.user); loadFollowups(); }
});
</script>
</body>
</html>
